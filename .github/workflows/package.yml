name: Package CV Studio

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create project ZIP
        shell: bash
        run: |
          zip -qr cv-studio-current.zip . -x ".git/*" ".github/workflows/package.yml"
      - name: Upload project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cv-studio-current
          path: cv-studio-current.zip
          retention-days: 7
