name: Package CV Studio

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create project ZIP from Git tree
        shell: bash
        run: |
          git archive --format=zip --output=cv-studio-current.zip HEAD
          zip -dq cv-studio-current.zip .github/workflows/package.yml || true
      - name: Upload project ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cv-studio-current-${{ github.run_number }}
          path: cv-studio-current.zip
          retention-days: 7
